name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no MT5 connection required)
        run: |
          pytest tests/ -v \
            --ignore=tests/test_candles.py \
            --ignore=tests/test_connection.py \
            --ignore=tests/test_symbols.py
